<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Submission Form</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --background-color: #f8f9fa;
            --surface-color: #ffffff;
            --text-color: #202124;
            --border-color: #dadce0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-container {
            background-color: var(--surface-color);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1557b0;
        }

        button:disabled {
            background-color: #a8c7fa;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            display: none;
        }

        .success {
            background-color: #e6f4ea;
            color: #137333;
            display: block;
        }

        .error {
            background-color: #fce8e6;
            color: #c5221f;
            display: block;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Submit Details</h2>
        <form id="submissionForm">
            <div class="form-group">
                <label for="number">Number</label>
                <input type="text" id="number" name="number" required placeholder="Enter number">
            </div>
            
            <div class="form-group">
                <label for="network">Network</label>
                <input type="text" id="network" name="network" required placeholder="Enter network">
            </div>

            <button type="submit" id="submitBtn">Submit Data</button>
            <div id="statusMessage" class="message"></div>
        </form>
    </div>

    <script>
        // Directly assigning your provided Google Apps Script Web App URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxJch5bIA4LoP0XPinXOL4N1KOt_6zITXEL0QVEDYhRi35PyfRHwWDFknBQl-ifb-fOTQ/exec';
        const form = document.getElementById('submissionForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // UI Feedback: Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            statusMessage.className = 'message';
            statusMessage.textContent = '';

            // Package form data
            const formData = new FormData(form);

            // Execute the fetch request to the Web App URL
            fetch(scriptURL, { 
                method: 'POST', 
                body: formData 
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json(); 
            })
            .then(data => {
                // Success Handling
                statusMessage.textContent = 'Data submitted successfully!';
                statusMessage.className = 'message success';
                form.reset();
            })
            .catch(error => {
                // Error Handling
                console.error('Error!', error.message);
                statusMessage.textContent = 'Failed to submit data. Please try again.';
                statusMessage.className = 'message error';
            })
            .finally(() => {
                // Restore button state
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Data';
            });
        });
    </script>
</body>
</html>
